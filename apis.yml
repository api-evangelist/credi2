name: Credi2
description: >-
  Credi2 GmbH is a Vienna, Austria based fintech that operates a white-label,
  cloud-native embedded lending platform enabling banks, card issuers, and
  merchants to launch Buy Now Pay Later (BNPL) and installment financing
  products under their own brand. The modular platform covers five financing
  products - pay per invoice (14-day BNPL), split pay (3-12 month installments
  up to EUR 5,000), installment loans (up to EUR 50,000 over 84 months),
  revolving credit lines, and subscription financing - and handles the full
  lifecycle including core banking operations, credit and risk management,
  servicing, and collections. Use cases span eCommerce and point-of-sale
  financing, subscription payments, installment-on-cards, and cash loans, with
  omni-channel integration and go-live in weeks. Credi2 is ISO 27001 and ISO
  27701 certified and is backed by Speedinvest.
